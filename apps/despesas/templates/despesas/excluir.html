{% extends "base.html" %}

{% block titulo %}Excluir despesa - Planejador de Viagens{% endblock %}

{% block conteudo %}
<h1>Excluir despesa</h1>

<article>
  <p>Tem certeza de que deseja excluir <strong>{{ despesa.descricao }}</strong> ({{ viagem.nome }})? Esta ação não pode ser desfeita.</p>
  <form method="post">
    {% csrf_token %}
    <div role="group">
      <button type="submit" class="perigo">Excluir definitivamente</button>
      <a href="{% url 'despesas:lista' viagem.pk %}" role="button" class="secondary outline">Cancelar</a>
    </div>
  </form>
</article>
{% endblock %}
