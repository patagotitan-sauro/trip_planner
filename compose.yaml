# Base file = production-like. Development adds compose.override.yaml,
# which Docker Compose loads automatically. To run without it:
#   docker compose -f compose.yaml up -d --build      (make prod-up)
name: trip-planner

services:
  app:
    build:
      context: .
      target: prod
    image: trip-planner:prod
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
      RUN_COLLECTSTATIC: "1"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - dados:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dados: