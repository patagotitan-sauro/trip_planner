repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: docker compose exec -T app ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: docker compose exec -T app ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: check-money-floats
        name: no float for money
        entry: docker compose exec -T app python scripts/check_money_floats.py
        language: system
        types: [python]
        require_serial: true